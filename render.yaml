services:
  - type: web
    runtime: static
    name: whatseasonisitinhorizon
    # pnpm is preinstalled on Render; don't `corepack enable` (read-only /usr/bin).
    buildCommand: pnpm --version && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - test/**
        - assets/**/*.ai
    domains:
      - whatseasonisitinhorizon.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # HTML picks the photo and season at runtime, so always revalidate it.
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Content-hashed filenames: safe to cache forever.
      - path: /bg/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
